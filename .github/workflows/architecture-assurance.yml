name: Architecture Assurance

on:
  pull_request:
    paths:
      - "assurance/**"
      - "architecture/**"
      - "docs/adr/**"
      - "docs/adversary/**"
      - "docs/assurance/**"
      - "docs/detection/**"
      - "docs/enterprise/**"
      - "docs/iac/**"
      - "docs/security/**"
      - "threat-model/**"
      - ".github/workflows/architecture-assurance.yml"

  push:
    branches:
      - phase-13/control-traceability-assurance
    paths:
      - "assurance/**"
      - "architecture/**"
      - "docs/adr/**"
      - "docs/adversary/**"
      - "docs/assurance/**"
      - "docs/detection/**"
      - "docs/enterprise/**"
      - "docs/iac/**"
      - "docs/security/**"
      - "threat-model/**"
      - ".github/workflows/architecture-assurance.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  assurance-gate:

    name: Architecture Assurance Gate

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate workflow security
        run: |
          python3 lab/supply-chain/policy/check-workflow-security.py

      - name: Run architecture assurance gate
        run: |
          make -C assurance test

      - name: Validate generated JSON
        run: |
          python3 -m json.tool assurance/source-registry.json >/dev/null
          python3 -m json.tool assurance/validation-source-registry.json >/dev/null
          python3 -m json.tool assurance/traceability-graph.json >/dev/null
          python3 -m json.tool assurance/evidence-catalog.json >/dev/null
          python3 -m json.tool assurance/coverage-report.json >/dev/null
          python3 -m json.tool assurance/final-assessment.json >/dev/null

      - name: Verify generated assurance reports
        run: |
          git diff --exit-code -- \
            assurance/coverage-report.json \
            assurance/final-assessment.json \
            docs/assurance/coverage-and-gaps.md \
            docs/assurance/final-assurance-assessment.md

      - name: Validate repository content
        run: |
          git diff --check

      - name: Upload assurance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-redoubt-architecture-assurance
          path: |
            assurance/coverage-report.json
            assurance/final-assessment.json
            assurance/traceability-graph.json
            assurance/evidence-catalog.json
          if-no-files-found: error
          retention-days: 30
