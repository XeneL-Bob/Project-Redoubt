name: Infrastructure Security

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - ".opentofu-version"
      - ".github/workflows/iac-security.yml"

  push:
    branches:
      - phase-11/iac-policy-as-code
    paths:
      - "infrastructure/**"
      - ".opentofu-version"
      - ".github/workflows/iac-security.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iac-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  iac-policy-gate:

    name: IaC Policy Gate

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"


      - name: Configure OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false


      - name: Validate workflow security
        run: |
          python3 lab/supply-chain/policy/check-workflow-security.py


      - name: Run infrastructure security gate
        run: |
          ./infrastructure/tests/ci-gate-test.sh


      - name: Upload policy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-redoubt-iac-policy-evidence
          path: |
            infrastructure/runtime/ci/policy-evidence.json
            infrastructure/runtime/ci/policy-evidence.sha256
          if-no-files-found: warn
          retention-days: 30
