name: project-redoubt

services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command:
      - start-dev
      - --import-realm
      - --hostname=http://localhost:8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      ALICE_PASSWORD: ${ALICE_PASSWORD}
      BOB_PASSWORD: ${BOB_PASSWORD}
      CAROL_PASSWORD: ${CAROL_PASSWORD}
      ERIN_PASSWORD: ${ERIN_PASSWORD}
      IAN_ADMIN_PASSWORD: ${IAN_ADMIN_PASSWORD}
      SOPHIE_ADMIN_PASSWORD: ${SOPHIE_ADMIN_PASSWORD}
    volumes:
      - ./identity/restech-realm.json:/opt/keycloak/data/import/restech-realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - identity_net

  opa:
    image: openpolicyagent/opa:1.17.0
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-format=json
      - /policy/restech.rego
    volumes:
      - ./policy/restech.rego:/policy/restech.rego:ro
    networks:
      - policy_net

  telemetry:
    build:
      context: ./telemetry
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      TELEMETRY_INGEST_TOKEN: ${TELEMETRY_INGEST_TOKEN}
    volumes:
      - ../evidence/runtime:/data
    networks:
      - edge_net
      - employee_net
      - finance_net
      - management_net
      - management_edge_net

  detection:
    build:
      context: ./detection
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      EVENTS_FILE: /data/security-events.jsonl
      ALERTS_FILE: /data/security-alerts.jsonl
      STATE_FILE: /data/detection-state.json
      RULES_FILE: /app/rules.json
    volumes:
      - ../evidence/runtime:/data
    network_mode: none
    depends_on:
      telemetry:
        condition: service_started
    restart: unless-stopped


  incident-response:
    build:
      context: ./incident
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      ALERTS_FILE: /data/security-alerts.jsonl
      INCIDENTS_FILE: /data/incidents.jsonl
      ACTIONS_FILE: /data/containment-actions.jsonl
      STATE_FILE: /data/incident-state.json
    volumes:
      - ../evidence/runtime:/data
    network_mode: none
    depends_on:
      detection:
        condition: service_started
    restart: unless-stopped



  privilege-broker:
    build:
      context: ./management/broker
    environment:
      KEYCLOAK_ISSUER: http://localhost:8080/realms/restech
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/restech/protocol/openid-connect/certs
      EXPECTED_AZP: redoubt-admin-cli

      ELEVATION_SIGNING_KEY: ${ELEVATION_SIGNING_KEY}
      ELEVATION_ISSUER: project-redoubt-privilege-broker
      ELEVATION_AUDIENCE: project-redoubt-management-plane
      MAX_ELEVATION_TTL_SECONDS: "120"

      TELEMETRY_URL: http://telemetry:9000
      TELEMETRY_INGEST_TOKEN: ${TELEMETRY_INGEST_TOKEN}
    ports:
      - "127.0.0.1:8101:8101"
    networks:
      - management_edge_net
      - identity_net
    depends_on:
      keycloak:
        condition: service_started
      telemetry:
        condition: service_started

  admin-opa:
    image: openpolicyagent/opa:1.17.0
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-format=json
      - /policy/admin.rego
    volumes:
      - ./management/policy/admin.rego:/policy/admin.rego:ro
    networks:
      - management_policy_net

  management-api:
    build:
      context: ./management/api
    environment:
      MANAGEMENT_GATEWAY_TOKEN: ${MANAGEMENT_GATEWAY_TOKEN}
      TELEMETRY_URL: http://telemetry:9000
      TELEMETRY_INGEST_TOKEN: ${TELEMETRY_INGEST_TOKEN}
    networks:
      - management_net
    depends_on:
      telemetry:
        condition: service_started

  management-gateway:
    build:
      context: ./management/gateway
    environment:
      KEYCLOAK_ISSUER: http://localhost:8080/realms/restech
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/restech/protocol/openid-connect/certs
      EXPECTED_AZP: redoubt-admin-cli

      ADMIN_OPA_DECISION_URL: http://admin-opa:8181/v1/data/restech/admin/decision
      MANAGEMENT_API_URL: http://management-api:8201

      MANAGEMENT_GATEWAY_TOKEN: ${MANAGEMENT_GATEWAY_TOKEN}

      ELEVATION_SIGNING_KEY: ${ELEVATION_SIGNING_KEY}
      ELEVATION_ISSUER: project-redoubt-privilege-broker
      ELEVATION_AUDIENCE: project-redoubt-management-plane

      TELEMETRY_URL: http://telemetry:9000
      TELEMETRY_INGEST_TOKEN: ${TELEMETRY_INGEST_TOKEN}
    ports:
      - "127.0.0.1:8100:8100"
    networks:
      - management_edge_net
      - identity_net
      - management_policy_net
      - management_net
    depends_on:
      keycloak:
        condition: service_started
      admin-opa:
        condition: service_started
      management-api:
        condition: service_started
      telemetry:
        condition: service_started

  vault:
    image: hashicorp/vault:2.0.3
    command:
      - server
      - -dev
      - -dev-listen-address=0.0.0.0:8200
      - -dev-root-token-id=${VAULT_DEV_ROOT_TOKEN}
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
    networks:
      - secrets_net

  vault-init:
    image: hashicorp/vault:2.0.3
    user: "0:0"
    entrypoint:
      - /bin/sh
      - /config/init.sh
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD}
    volumes:
      - ./vault/init.sh:/config/init.sh:ro
      - ./vault/finance-api.hcl:/config/finance-api.hcl:ro
      - vault_bootstrap:/bootstrap
    depends_on:
      vault:
        condition: service_started
    networks:
      - secrets_net
    restart: "no"

  finance-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance_app
      POSTGRES_PASSWORD: ${FINANCE_DB_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U finance_app -d finance
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - finance_db_data:/var/lib/postgresql/data
    networks:
      - data_net


  backup-agent:
    image: postgres:17-alpine
    command:
      - sh
      - -c
      - while true; do sleep 3600; done
    environment:
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD}
      BACKUP_FILE: /recovery/finance.sql
    volumes:
      - ./recovery/backup.sh:/usr/local/bin/redoubt-backup:ro
      - recovery_store:/recovery
    networks:
      - data_net
    depends_on:
      finance-db:
        condition: service_healthy
    restart: unless-stopped

  recovery-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recovery
      POSTGRES_USER: recovery_admin
      POSTGRES_PASSWORD: ${RECOVERY_DB_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U recovery_admin -d recovery
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - recovery_db_data:/var/lib/postgresql/data
      - recovery_store:/recovery:ro
      - ./recovery/restore.sh:/usr/local/bin/redoubt-restore:ro
    networks:
      - recovery_net

  employee-api:
    build:
      context: ./apps/employee-api
    environment:
      GATEWAY_EMPLOYEE_TOKEN: ${GATEWAY_EMPLOYEE_TOKEN}
      TELEMETRY_URL: http://telemetry:9000
      TELEMETRY_INGEST_TOKEN: ${TELEMETRY_INGEST_TOKEN}
    networks:
      - employee_net
    depends_on:
      telemetry:
        condition: service_started

  finance-api:
    build:
      context: ./apps/finance-api
    environment:
      GATEWAY_FINANCE_TOKEN: ${GATEWAY_FINANCE_TOKEN}

      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID_FILE: /bootstrap/finance-api-role-id
      VAULT_SECRET_ID_FILE: /bootstrap/finance-api-secret-id

      TELEMETRY_URL: http://telemetry:9000
      TELEMETRY_INGEST_TOKEN: ${TELEMETRY_INGEST_TOKEN}
    volumes:
      - vault_bootstrap:/bootstrap:ro
    networks:
      - finance_net
      - data_net
      - secrets_net
    depends_on:
      finance-db:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      telemetry:
        condition: service_started

  gateway:
    build:
      context: ./gateway
    environment:
      KEYCLOAK_ISSUER: http://localhost:8080/realms/restech
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/restech/protocol/openid-connect/certs
      EXPECTED_AZP: redoubt-test-cli

      OPA_DECISION_URL: http://opa:8181/v1/data/restech/authz/decision

      EMPLOYEE_API_URL: http://employee-api:8000
      FINANCE_API_URL: http://finance-api:8000

      GATEWAY_EMPLOYEE_TOKEN: ${GATEWAY_EMPLOYEE_TOKEN}
      GATEWAY_FINANCE_TOKEN: ${GATEWAY_FINANCE_TOKEN}

      TELEMETRY_URL: http://telemetry:9000
      TELEMETRY_INGEST_TOKEN: ${TELEMETRY_INGEST_TOKEN}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - edge_net
      - identity_net
      - policy_net
      - employee_net
      - finance_net
    depends_on:
      keycloak:
        condition: service_started
      opa:
        condition: service_started
      employee-api:
        condition: service_started
      finance-api:
        condition: service_started
      telemetry:
        condition: service_started

networks:

  edge_net:
    driver: bridge

  identity_net:
    driver: bridge

  policy_net:
    driver: bridge
    internal: true

  employee_net:
    driver: bridge
    internal: true

  finance_net:
    driver: bridge
    internal: true

  data_net:
    driver: bridge
    internal: true

  secrets_net:
    driver: bridge
    internal: true


  management_edge_net:
    driver: bridge

  management_policy_net:
    driver: bridge
    internal: true

  management_net:
    driver: bridge
    internal: true

  recovery_net:
    driver: bridge
    internal: true

volumes:
  finance_db_data:
  vault_bootstrap:
  recovery_store:
  recovery_db_data:
